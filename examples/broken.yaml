# DELIBERATELY NON-COMPLIANT demo fixture.
#
# Six unambiguous violations. One run with the default AI cap (7 calls) proposes a
# fix for each, plus one AI review of the summaries and descriptions. Every violation is a *standards* violation, not a schema
# error: this document is valid OpenAPI 3.1 and must stay that way, or the rule pass
# never gets to run. tests/fixtures/all-rules-broken.yaml breaks all 11 rules.
#
# Violation map (keep in sync with .gds-goldens/):
#
#   GDS-001  servers[0].url uses http://                      -> servers[0]
#   GDS-003  no version segment in the path                   -> paths./users
#   GDS-004  GET 200 responds application/xml, not JSON       -> GET 200 content
#   NCSC-001 basicAuth is http/basic                          -> securitySchemes
#   NCSC-002 GET opts out of auth with security: []           -> GET security
#   REC-002  GET has no description                           -> GET operation

openapi: 3.1.0
info:
  title: Example Department User Service
  version: 1.0.0
  description: Fixture service used to exercise the GDS + NCSC ruleset.

# GDS-001: plaintext transport.
servers:
  - url: http://api.example.gov.uk
    description: Production

security:
  - basicAuth: []

# GDS-003: no /v1/ segment.
paths:
  /users:
    get:
      summary: List users
      # REC-002: no description.
      operationId: listUsers
      # NCSC-002: explicitly unauthenticated.
      security: []
      responses:
        '200':
          description: A list of users.
          content:
            # GDS-004: XML rather than JSON.
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '429':
          description: Too many requests.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Internal server error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      summary: Create a user
      description: Creates a new user record and returns the stored representation.
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - name
                - createdOn
              properties:
                name:
                  type: string
                createdOn:
                  type: string
                  format: date-time
      responses:
        '201':
          description: The created user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '429':
          description: Too many requests.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Internal server error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

components:
  securitySchemes:
    # NCSC-001: HTTP Basic.
    basicAuth:
      type: http
      scheme: basic

  schemas:
    User:
      type: object
      additionalProperties: false
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        createdOn:
          type: string
          format: date-time

    Problem:
      description: RFC 9457 problem details.
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri
